name: Build and push images

on:
  push:
    branches: [main]
    paths:
      - 'omniagent-java/**'
      - 'omniagent-agent/OmniAgent/**'
      - 'omniagent-vue/omniagent/**'
      - '.github/workflows/images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: java
            context: ./omniagent-java
            image: omniagent-java
          - service: agent
            context: ./omniagent-agent/OmniAgent
            image: omniagent-agent
          - service: vue
            context: ./omniagent-vue/omniagent
            image: omniagent-vue
    steps:
      - uses: actions/checkout@v4

      # GHCR 命名空间必须是小写；github.repository_owner 可能含大写字母
      - name: 计算小写命名空间
        id: ns
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.ns.outputs.owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      # vue 的 VITE_AGENT_BASE 在 Dockerfile 中默认 /agent，无需重复传 build-args
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
